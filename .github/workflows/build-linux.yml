name: Build Linux

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-groups
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: bash packaging/posix/build-installer.sh
        env:
          PACKAGE_PLATFORM: Linux
          PACKAGE_ARCH: x86_64
      - name: Verify portable archive
        run: |
          unzip -Z1 dist/posix/OllamaConfigurator-Linux-x86_64.zip > "$RUNNER_TEMP/linux-zip-list.txt"
          grep -Fx 'README.md' "$RUNNER_TEMP/linux-zip-list.txt"
          grep -Fx 'install.sh' "$RUNNER_TEMP/linux-zip-list.txt"
          grep -Fx 'run.sh' "$RUNNER_TEMP/linux-zip-list.txt"
          grep -Fx 'uninstall.sh' "$RUNNER_TEMP/linux-zip-list.txt"
          grep -Fx 'backend/OllamaConfiguratorBackend/OllamaConfiguratorBackend' "$RUNNER_TEMP/linux-zip-list.txt"
          ! grep -E '\.(dmg|bat|ps1)$' "$RUNNER_TEMP/linux-zip-list.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: OllamaConfigurator-Linux-x86_64
          path: dist/posix/
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$repo" --title "Ollama Configurator $tag" --generate-notes || true
          fi
          zip="dist/posix/OllamaConfigurator-Linux-x86_64.zip"
          (cd dist/posix && sha256sum OllamaConfigurator-Linux-x86_64.zip > checksums-Linux.txt)
          gh release upload "$tag" "$zip" dist/posix/checksums-Linux.txt --repo "$repo" --clobber
