name: Build macOS

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-groups
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash packaging/macos/build-app.sh
      - name: Verify portable archive
        run: |
          unzip -Z1 dist/macos/OllamaConfigurator-macOS-arm64.zip > "$RUNNER_TEMP/macos-zip-list.txt"
          grep -Fx 'README.md' "$RUNNER_TEMP/macos-zip-list.txt"
          grep -Fx 'Ollama Configurator.app/Contents/Info.plist' "$RUNNER_TEMP/macos-zip-list.txt"
          grep -Fx 'Ollama Configurator.app/Contents/Resources/frontend/index.html' "$RUNNER_TEMP/macos-zip-list.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: OllamaConfigurator-macOS-arm64
          path: dist/macos/
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$repo" \
              --title "Ollama Configurator $tag" \
              --generate-notes || true
          fi
          dmg="dist/macos/OllamaConfigurator-macOS.dmg"
          if [[ ! -f "$dmg" ]]; then
            echo "Expected macOS installer not found: $dmg" >&2
            exit 1
          fi
          zip="dist/macos/OllamaConfigurator-macOS-arm64.zip"
          (cd dist/macos && shasum -a 256 OllamaConfigurator-macOS.dmg OllamaConfigurator-macOS-arm64.zip > checksums-macOS.txt)
          gh release upload "$tag" "$dmg" "$zip" dist/macos/checksums-macOS.txt \
            --repo "$repo" \
            --clobber
